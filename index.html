<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nganya Empire - Nairobi Matatu Racing 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; overflow: hidden; background: #000; color: #fff; }
#game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
#hud { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(0,0,0,0.7); z-index: 10; }
#logo { font-size: 22px; font-weight: 900; color: #FFD700; }
#logo span { color: #fff; }
#stats { display: flex; gap: 12px; font-size: 13px; }
#stats b { color: #00FF00; }
#musicBtn { background: #FF1493; color: #fff; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
#garage { position: fixed; top: 55px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 2px solid #FFD700; }
#garage p { font-size: 12px; color: #FFD700; margin-bottom: 5px; font-weight: bold; }
#garage button { display: block; width: 100%; margin: 3px 0; padding: 6px; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
#garage button:active { background: #FFD700; color: #000; }
#controls { position: fixed; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 10px; z-index: 10; }
.left-controls, .right-controls { display: flex; gap: 10px; }
#controls button { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; font-weight: 900; font-size: 12px; color: #fff; cursor: pointer; }
#leftBtn, #rightBtn { background: #333; }
#gasBtn { background: #00AA00; width: 85px !important; height: 85px !important; font-size: 14px; }
#brakeBtn { background: #CC0000; }
#hornBtn { background: #FFAA00; color: #000 !important; }
#driftBtn { background: #800080; }
#message { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: #FFD700; color: #000; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; z-index: 10; text-align: center; white-space: nowrap; }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="hud">
  <div id="logo">NGANYA <span>EMPIRE</span></div>
  <div id="stats">
    <div>Speed: <b id="speed">0</b> KM/H</div>
    <div>Coins: <b id="coins">0</b></div>
    <div>Passengers: <b id="passengers">0</b></div>
  </div>
  <button id="musicBtn">Music: ON</button>
</div>

<div id="garage">
  <p>CHOOSE GRAFFITI:</p>
  <button onclick="changeGraffiti('#FFD700')">Gold Legend</button>
  <button onclick="changeGraffiti('#000000')">Tupac Black</button>
  <button onclick="changeGraffiti('#FF1493')">Rihanna Pink</button>
  <button onclick="changeGraffiti('#FF0000')">Money Heist Red</button>
  <button onclick="changeGraffiti('#00FF00')">Gengetone Green</button>
</div>

<div id="controls">
  <div class="left-controls">
    <button id="leftBtn">LEFT</button>
    <button id="rightBtn">RIGHT</button>
  </div>
  <div class="right-controls">
    <button id="hornBtn">HORN</button>
    <button id="brakeBtn">BRAKE</button>
    <button id="gasBtn">GAS</button>
    <button id="driftBtn">DRIFT</button>
  </div>
</div>

<div id="message">Welcome to Thika Road! Press GAS to start!</div>

<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
let scene, camera, renderer;
let nganya, nganyaBody;
let speed = 0, coins = 0, passengers = 0;
let keys = { left: false, right: false, gas: false, brake: false, drift: false };
let traffic = [];
let busStops = [];

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 8, -12);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('game-container').appendChild(renderer.domElement);

  let light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  let road = new THREE.Mesh(new THREE.BoxGeometry(20, 0.2, 500), new THREE.MeshLambertMaterial({ color: 0x333333 }));
  road.position.set(0, 0, -100);
  scene.add(road);

  for (let i = 0; i < 50; i++) {
    let line = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    line.position.set(0, 0.2, i * -10);
    scene.add(line);
  }

  for (let i = 0; i < 30; i++) {
    let h = Math.random() * 20 + 5;
    let colors = [0xFF5733, 0x33FF57, 0x3357FF, 0xFFD700, 0xFF33A8];
    let b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), new THREE.MeshLambertMaterial({ color: colors[i % 5] }));
    let side = i % 2 === 0 ? -18 : 18;
    b.position.set(side, h / 2, i * -15);
    scene.add(b);
  }

  nganya = new THREE.Group();
  nganyaBody = new THREE.Mesh(new THREE.BoxGeometry(3, 1.8, 6), new THREE.MeshLambertMaterial({ color: 0xFFD700 }));
  nganyaBody.position.y = 1.2;
  nganya.add(nganyaBody);

  let roof = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.4, 4), new THREE.MeshLambertMaterial({ color: 0x000000 }));
  roof.position.y = 2.3;
  nganya.add(roof);

  let speaker = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1), new THREE.MeshLambertMaterial({ color: 0x111111 }));
  speaker.position.set(0, 2.8, 0);
  nganya.add(speaker);

  let neon = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.2, 6.2), new THREE.MeshBasicMaterial({ color: 0x00FFFF }));
  neon.position.y = 0.2;
  nganya.add(neon);

  let wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 12);
  let wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  [[-1.6, 2], [1.6, 2], [-1.6, -2], [1.6, -2]].forEach(pos => {
    let w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(pos[0], 0.6, pos[1]);
    nganya.add(w);
  });

  nganya.position.set(0, 0, 0);
  scene.add(nganya);

  for (let i = 0; i < 8; i++) {
    let car = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 5), new THREE.MeshLambertMaterial({ color: 0xFF0000 }));
    car.position.set((Math.random() * 12 - 6), 0.8, -30 - i * 40);
    scene.add(car);
    traffic.push(car);
  }

  for (let i = 0; i < 3; i++) {
    let stop = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 1), new THREE.MeshLambertMaterial({ color: 0x00FF00 }));
    stop.position.set(12, 1.5, -60 - i * 100);
    scene.add(stop);
    busStops.push(stop);
  }

  setupControls();
}

function changeGraffiti(color) {
  nganyaBody.material.color.set(color);
  showMessage("Graffiti Changed! You look like a King!");
  coins += 10;
  updateHUD();
}

function setupControls() {
  const bind = (id, key) => {
    let el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('touchend', () => keys[key] = false);
    el.addEventListener('mousedown', () => keys[key] = true);
    el.addEventListener('mouseup', () => keys[key] = false);
  };
  bind('leftBtn', 'left');
  bind('rightBtn', 'right');
  bind('gasBtn', 'gas');
  bind('brakeBtn', 'brake');
  bind('driftBtn', 'drift');

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
    if (e.key === 'ArrowUp') keys.gas = true;
    if (e.key === 'ArrowDown') keys.brake = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
    if (e.key === 'ArrowUp') keys.gas = false;
    if (e.key === 'ArrowDown') keys.brake = false;
  });

  document.getElementById('hornBtn').addEventListener('click', () => {
    showMessage("HONK! HONK! NGANYA COMING!");
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    osc.frequency.value = 400;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  });

  let musicOn = true;
  document.getElementById('musicBtn').addEventListener('click', function() {
    let audio = document.getElementById('bgMusic');
    musicOn = !musicOn;
    if (musicOn) { audio.play(); this.textContent = "Music: ON"; }
    else { audio.pause(); this.textContent = "Music: OFF"; }
  });
}

function showMessage(text) {
  let m = document.getElementById('message');
  m.textContent = text;
  setTimeout(() => m.textContent = "Race on Thika Road! Pick up passengers!", 3000);
}

function updateHUD() {
  document.getElementById('speed').textContent = Math.floor(speed);
  document.getElementById('coins').textContent = coins;
  document.getElementById('passengers').textContent = passengers;
}

function animate() {
  requestAnimationFrame(animate);
  if (keys.gas) speed += 0.5;
  if (keys.brake) speed -= 1;
  if (!keys.gas && !keys.brake) speed -= 0.2;
  if (speed < 0) speed = 0;
  if (speed > 60) speed = 60;
  if (keys.left) nganya.position.x -= 0.15 + speed * 0.002;
  if (keys.right) nganya.position.x += 0.15 + speed * 0.002;
  if (keys.drift) nganya.rotation.y = Math.sin(Date.now() * 0.01) * 0.3;
  if (nganya.position.x > 8) nganya.position.x = 8;
  if (nganya.position.x < -8) nganya.position.x = -8;

  traffic.forEach(car => {
    car.position.z += speed * 0.08;
    if (car.position.z > 20) {
      car.position.z = -200;
      car.position.x = Math.random() * 12 - 6;
      coins += 5;
    }
    if (Math.abs(car.position.z - nganya.position.z) < 4 && Math.abs(car.position.x - nganya.position.x) < 2) {
      speed = 0;
      showMessage("CRASH! Watch out for traffic!");
    }
  });

  busStops.forEach(stop => {
    stop.position.z += speed * 0.08;
    if (stop.position.z > 20) stop.position.z = -300;
    if (Math.abs(stop.position.z) < 5 && speed < 10 && speed > 0) {
      passengers += 1;
      coins += 20;
      showMessage("Passenger picked! +20 coins");
      stop.position.z = -300;
    }
  });

  camera.position.set(nganya.position.x, 7, nganya.position.z - 10);
  camera.lookAt(nganya.position.x, 1, nganya.position.z + 10);
  updateHUD();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
